name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      # Hosted runners have one display; keep native fixtures fully on-screen.
      # This uses the same physical-coordinate setup as attended qualification.
      UI_ATLAS_NATIVE_TEST_LEFT: '100'
      UI_ATLAS_NATIVE_TEST_TOP: '150'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.200
      - run: dotnet restore UiAtlas.Core.slnx --locked-mode
      - run: dotnet build UiAtlas.Core.slnx -c Release --no-restore -m:1 -nr:false
      - shell: pwsh
        run: ./tools/Test-RecorderViewerBuild.ps1 -Configuration Release
      - run: dotnet test UiAtlas.Core.slnx -c Release --no-build --no-restore -m:1
      - shell: pwsh
        run: ./tools/Test-RepositoryBoundary.ps1
      - shell: pwsh
        run: ./tools/Smoke-Offline.ps1
