syntax = "proto3";

package uimaps.v3;
option csharp_namespace = "UIMaps.Protocol.V3";

// Local, explicit snapshot handoff between the mapping editor and a Map library.
// A transferred draft is not published and does not authorize target input.
message MappingDraftSnapshot {
  MappingSessionDescriptor session = 1;
  UiMapDraft draft = 2;
}
message ImportMappingWorkspaceRequest {
  string request_id = 1;
  repeated MappingDraftSnapshot snapshots = 2;
  string source_archive_path = 3;
  string source_archive_sha256 = 4;
  string source_format = 5;
}
message ImportMappingWorkspaceResponse {
  repeated string mapping_session_refs = 1;
  repeated string map_draft_refs = 2;
  string retained_archive_sha256 = 3;
  bool already_present = 4;
}

import "uimaps/v1/common.proto";
import "uimaps/v1/perception.proto";
import "uimaps/v1/survey.proto";
import "uimaps/v2_1/grid_map.proto";
import "uimaps/v2_1/grid_analysis.proto";
import "uimaps/v2_1/grid_region.proto";
import "uimaps/v2_1/grid_delta.proto";

